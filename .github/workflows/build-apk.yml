name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Inject API Key
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        echo "API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -Dkotlin.daemon.jvm.options=-Xmx2048m"

    # CRITICAL MISSING STEP: Yeh aapki bani hui APK ko download ke liye screen par laayega
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ji-Huzur-AI-App
        path: app/build/outputs/apk/debug/app-debug.apk
